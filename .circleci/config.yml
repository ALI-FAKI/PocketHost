version: 2.1

jobs:
  build:
    docker:
      - image: cimg/android:2024.11.1
    resource_class: medium
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - checkout
      
      - run:
          name: Generate Gradle Wrapper
          command: |
            # If the wrapper is missing, generate it using the system Gradle
            if [ ! -f gradlew ]; then
              gradle wrapper --gradle-version 8.6
            fi
            chmod +x ./gradlew

      - run:
          name: Download Cloudflared Binary
          command: |
            mkdir -p app/src/main/jniLibs/arm64-v8a
            curl -L -o app/src/main/jniLibs/arm64-v8a/libcloudflared.so https://github.com/QudsLab/Cloudflared/raw/main/android/arm64-v8a/libcloudflared.so
            chmod +x app/src/main/jniLibs/arm64-v8a/libcloudflared.so

      - run:
          name: Build Debug APK
          command: |
            ./gradlew assembleDebug --no-daemon --stacktrace

      - store_artifacts:
          path: app/build/outputs/apk/debug/app-debug.apk
          destination: PocketHost-debug.apk

workflows:
  build-apk:
    jobs:
      - build
